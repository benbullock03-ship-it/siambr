name: sync

on:
  schedule:
    # Every 30 minutes through Tuesday and Wednesday sittings, once a day otherwise (UTC).
    - cron: '*/30 13-23 * * 2,3'
    - cron: '0 6 * * *'
  workflow_dispatch:

# Two ticks never push over each other; a queued tick waits for the running one.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poll the Record of Proceedings
        run: python -m pipeline.sync

      # A quiet run still writes its sync_runs row into the database, so the commit test looks only
      # at the record itself. The DB rides along whenever the record moved.
      - name: Detect changed sittings
        id: changes
        run: |
          changed=$(git status --porcelain -- data/bronze frontend/static/data)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            dates=$(git status --porcelain -- frontend/static/data/sittings | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')
            echo "dates=${dates:-}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the record
        if: steps.changes.outputs.changed == 'true'
        run: python -m pipeline.run_checks

      - name: Commit Bronze, Gold and static data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'siambr-sync'
          git config user.email 'siambr-sync@users.noreply.github.com'
          git add data/bronze data/siambr.db frontend/static/data
          git commit -m "sync: ${{ steps.changes.outputs.dates }}"
          git push

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site
        if: steps.changes.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=siambr --branch=main
