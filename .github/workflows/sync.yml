name: sync

# Polls the Record of Proceedings and commits new or revised sittings. It does not build or
# deploy: there is no live site yet. The deploy job in deploy.yml is manual until there is one.
#
# Senedd Plenary sits on Tuesdays and Wednesdays from 13:30 UK time. The Record for a sitting is
# normally published the following morning (observed 09:00-11:00 UTC) and revised again later, so
# the windows below poll the sitting day and the morning after. Times are UTC; GitHub delays
# scheduled runs by minutes to hours, which the windows are wide enough to absorb.
on:
  schedule:
    - cron: '*/30 13-23 * * 2,3'  # sitting day, through the evening
    - cron: '*/30 0-12 * * 3,4'   # the morning after each sitting
    - cron: '0 6 * * *'           # daily catch-up for anything the windows above miss
  workflow_dispatch:

# Two ticks never push over each other; a queued tick waits for the running one.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poll the Record of Proceedings
        run: |
          set -o pipefail
          python -m pipeline.sync | tee sync.log
          {
            echo '### Record of Proceedings'
            echo '```'
            tail -n 1 sync.log
            echo '```'
            # Skips and unavailability are omissions from the record; never let them pass unseen.
            echo '<details><summary>Full log</summary>'
            echo
            echo '```'
            cat sync.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # A quiet run still writes its sync_runs row into the database, so the commit test looks only
      # at the record itself. The DB rides along whenever the record moved.
      - name: Detect changed sittings
        id: changes
        run: |
          changed=$(git status --porcelain -- data/bronze frontend/static/data)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            dates=$(git status --porcelain -- frontend/static/data/sittings | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')
            echo "dates=${dates:-}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Fast path of the T-24 gates: verbatim against the live Record, then export determinism.
      - name: Verbatim gate
        if: steps.changes.outputs.changed == 'true'
        run: python -m pipeline.run_checks --sample 40

      - name: Export determinism
        if: steps.changes.outputs.changed == 'true'
        run: |
          digest() { find frontend/static/data -type f -name '*.json' | sort | xargs sha256sum | sha256sum; }
          before=$(digest)
          python -m pipeline.export
          after=$(digest)
          if [ "$before" != "$after" ]; then
            echo "::error::pipeline.export run twice on the same database wrote different JSON"
            exit 1
          fi

      - name: Commit Bronze, Gold and static data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'siambr-sync'
          git config user.email 'siambr-sync@users.noreply.github.com'
          git add data/bronze data/siambr.db frontend/static/data
          git commit -m "sync: ${{ steps.changes.outputs.dates }}"
          git push
