name: deploy

# Code changes deploy on push; data changes deploy from sync.yml after their own commit.
# Every gate in siambr-spec.md 10.2 runs first; a failing gate blocks the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'frontend/static/data/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Pipeline unit tests
        run: python -m unittest

      # The only network call before the deploy step. Senedd unreachable reports "source unavailable"
      # in the job summary and passes; a speech that differs from the live Record fails.
      - name: Verbatim gate
        run: python -m pipeline.run_checks --sample 40

      - name: Prose linter
        run: python -m scripts.check_prose

      - name: Export determinism
        run: |
          python -m pipeline.export
          changed=$(git status --porcelain frontend/static/data)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat frontend/static/data
            echo "::error::pipeline.export against the committed database changed frontend/static/data"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Timeline, provenance and unit gates
        working-directory: frontend
        run: npm test

      - name: Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate
        working-directory: frontend
        run: npm run test:a11y

      # Chromium's SwiftShader draws this scene at under 2 fps (T-17, T-24 notes), so the trace
      # cannot meet its 33 ms / 20 ms p95 bars on a GPU-less runner. It runs and reports; it does
      # not block until a runner with a GPU, or a lighter CI scene, is in place.
      - name: Performance gate
        working-directory: frontend
        continue-on-error: true
        run: npm run test:perf

      # Senedd TV on the wall screens stays off in production until the Senedd news team replies in writing (T-33).
      - name: Build the site
        working-directory: frontend
        env:
          PUBLIC_SCREEN_VIDEO: '0'
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/build
          retention-days: 1

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=siambr --branch=main
