<body>
    <div class="player-content">

            

<div id="vuplay-player-container" lang="en"></div>

<script type="text/javascript">
    var messenger;
    var player;
    var videoSkin;
    var container;

    var vuplayPlayerKey = "nafw|634cd5f4-6684-4a53-ab1b-a2a7f410580f";
    var autoStart = true;
    var meetingStart = "2026-09-16T13:30:07+01:00";
    var langCode = "en";
    var seekStart;

    var config = {
        playerKey: vuplayPlayerKey,
        src: "http://nafw.cdn.vustreams.com/m/da9a11ba-c9d7-4192-90f9-bc800749a6cc/interpretation/interpretation.isml/interpretation.m3u8?t=2026-09-16T12:30:07",
        autoStart: autoStart,
        title: "Plenary",
        streamTypeOverride: "vod",
        skipAmount: 10
    };

    var subtitleVTTPath = "";
    if (subtitleVTTPath) {
        config.externalTextTracks = [{
            url: subtitleVTTPath,
            lang: langCode
        }];
    }

    var thumbnailsTrackUrl = "https://d15s0s5p6n38fq.cloudfront.net/content/vod/meeting_thumbs/ab984fcd-75b6-4e17-b1d0-000099918abf/meeting_thumbnails.vtt";
    if (thumbnailsTrackUrl) {
        config.thumbnailsTrackUrl = thumbnailsTrackUrl;
    }

    $(function () {
        player = new NAfWPlayer(config);

        videoSkin = document.createElement("vualto-skin");
        videoSkin.classList.add("nafw");
        container = document.getElementById("vuplay-player-container");

        player.setup(container, videoSkin);

        player.vuplaySmart.on(Vuplay.EventType.VUPLAY, Vuplay.Events.playerready, onPlayerReady);

        function onPlayerReady() {
            messenger = IFrameMessenger({
                PlayerWrapper: player,
                parentUrl: decodeURIComponent(document.location.hash.replace(/^#/, '')),
                parent: window.parent,
                startUTC: meetingStart
            });

            if (seekStart) { player.vuplaySmart.seek(seekStart); }

            videoSkin.skinTitle = config.title;
        }
    });
</script>

    </div>
<script type="text/javascript">
    function run() { }

    var currentState = "Archive";

    var livePlayerUrl = "/Player/LivePlayer/da9a11ba-c9d7-4192-90f9-bc800749a6cc?autostart=True&captionsOn=False";
    var archivePlayerUrl = "/Player/ArchivePlayer/da9a11ba-c9d7-4192-90f9-bc800749a6cc?autoStart=True&captionsOn=False";
    var pausedPlayerUrl = "/Player/PausedPlayer/da9a11ba-c9d7-4192-90f9-bc800749a6cc";

    var parentUrl = decodeURIComponent(document.location.hash.replace(/^#/, ''));

    var externalCaptions = true;
    var dirtyFeed = false;

    $(function () {
        var stateChanger = $.connection.changeMeetingStateHub;
        stateChanger.client.meetingStateChange = function (linkId, meetingState) { meetingStateChange(linkId, meetingState); };
        stateChanger.client.changeCaption = function (linkId, lineOne, lineTwo, lineThree) { changeCaption(linkId, lineOne, lineTwo, lineThree); };
        stateChanger.client.removeCaption = function (linkId) { removeCaption(linkId); };

        $.connection.hub.start().done(run);
    });

    function changeCaption(linkId, lineOne, lineTwo, lineThree) {
        if (linkId == "ab984fcd-75b6-4e17-b1d0-000099918abf" && currentState == "Live") {
            $.postMessage("ChangeCaption_" + lineOne + "_" + lineTwo + "_" + lineThree, parentUrl, parent);
        }
    }

    function removeCaption(linkId) {
        if (linkId == "ab984fcd-75b6-4e17-b1d0-000099918abf" && currentState == "Live") {
            $.postMessage("RemoveCaption", parentUrl, parent);
        }
    }

    function meetingStateChange(linkId, meetingState) {
        if (linkId == "ab984fcd-75b6-4e17-b1d0-000099918abf" && currentState != meetingState) {
            changeMeetingState(meetingState);
        }
    }

    function sendisWatchingDvr() {
        $.postMessage("IsWatchingDvr_" + isWatchingDvr(), parentUrl, parent);
    }

    function changeMeetingState(newMeetingState) {

        var url = "";
        switch (newMeetingState) {
        case "Live":
            url = livePlayerUrl;
            currentState = newMeetingState;
            break;
        case "Archive":
            isWatchingDvr();
            $.postMessage("GoToArchive", parentUrl, parent);
            url = archivePlayerUrl;
            currentState = newMeetingState;

            break;
        case "Paused":
            isWatchingDvr();
            url = pausedPlayerUrl;
            currentState = newMeetingState;
            break;
        }

        $.get(url, function (data) {
            $('.player-content').html(data);
            run();
        });
    }

    function checkMeetingState() {
        $.get("/Player/MeetingState?linkId=ab984fcd-75b6-4e17-b1d0-000099918abf", function (state) {
            if (state != currentState) changeMeetingState(state);
        });
        return;
    }
</script>

<script src="/Scripts/jquery.signalR-2.0.3.js"></script>
<script src="/signalr/hubs"></script>
</body>
</html>
